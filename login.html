<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - KPPN Digipay Monitoring</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 50px 40px;
        width: 100%;
        max-width: 420px;
        animation: slideIn 0.5s ease;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .login-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .login-header .logo {
        font-size: 48px;
        margin-bottom: 12px;
      }

      .login-header h1 {
        color: #2563eb;
        font-size: 26px;
        margin-bottom: 6px;
      }

      .login-header p {
        color: #64748b;
        font-size: 14px;
      }

      .login-error {
        background: #fee2e2;
        color: #991b1b;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 13px;
        margin-bottom: 20px;
        display: none;
        border-left: 4px solid #ef4444;
      }

      .login-error.active {
        display: block;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        color: #475569;
        font-weight: 600;
        margin-bottom: 8px;
        font-size: 14px;
      }

      .form-group input {
        width: 100%;
        padding: 14px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        font-size: 14px;
        transition: all 0.3s ease;
        color: #334155;
      }

      .form-group input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .login-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        color: white;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }

      .login-btn:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      }

      .login-btn:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        transform: none;
      }

      .login-footer {
        text-align: center;
        margin-top: 28px;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="login-header">
        <div class="logo">🏛️</div>
        <h1>KPPN Sistem</h1>
        <p>Digipay Monitoring — Silakan login untuk melanjutkan</p>
      </div>

      <div class="login-error" id="loginError"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input
            type="text"
            id="loginUsername"
            placeholder="Masukkan username"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Masukkan password"
            required
            autocomplete="current-password"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Masuk</button>
      </form>

      <div class="login-footer">
        Sistem Manajemen Data Digipay<br />
        KPPN Pekalongan
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://tpmmpzsujmhadmsaynsa.supabase.co";
      const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwbW1wenN1am1oYWRtc2F5bnNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk2MzQ0NDcsImV4cCI6MjA3NTIxMDQ0N30.x91ksouGDFhe7MiRFEMD-geLHHMgK1VkrNzzIlda9YI";

      const { createClient } = supabase;
      const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

      // Jika sudah login, langsung redirect ke index.html
      const existingSession = localStorage.getItem("kppn_session");
      if (existingSession) {
        try {
          const session = JSON.parse(existingSession);
          if (new Date().getTime() < session.expiryTime) {
            window.location.href = "index.html";
          } else {
            localStorage.removeItem("kppn_session");
          }
        } catch (e) {
          localStorage.removeItem("kppn_session");
        }
      }

      function showError(msg) {
        const el = document.getElementById("loginError");
        el.textContent = "❌ " + msg;
        el.classList.add("active");
      }

      function clearError() {
        document.getElementById("loginError").classList.remove("active");
      }

      function setLoading(isLoading) {
        const btn = document.getElementById("loginBtn");
        btn.disabled = isLoading;
        btn.textContent = isLoading ? "⏳ Memproses..." : "Masuk";
      }

      document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        clearError();
        setLoading(true);

        const username = document.getElementById("loginUsername").value.trim();
        const password = document.getElementById("loginPassword").value;

        try {
          if (!username || !password) {
            throw new Error("Username dan password harus diisi");
          }

          const { data, error } = await supabaseClient
            .from("admin")
            .select("*")
            .eq("username", username)
            .single();

          if (error || !data) {
            throw new Error("Username atau password salah");
          }

          if (data.password !== password) {
            throw new Error("Username atau password salah");
          }

          // Simpan session (7 hari)
          const sessionData = {
            username: username,
            loginTime: new Date().getTime(),
            expiryTime: new Date().getTime() + (7 * 24 * 60 * 60 * 1000),
          };
          localStorage.setItem("kppn_session", JSON.stringify(sessionData));

          // Redirect ke halaman utama
          window.location.href = "index.html";

        } catch (err) {
          showError(err.message);
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
